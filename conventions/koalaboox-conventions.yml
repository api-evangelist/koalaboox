    industry-standard authentication." — developer portal home, verbatim.
  base_url: https://connect.koalaboox.com
  path_prefix: /api
content_negotiation:
  request_media_type: application/json
  response_media_type: application/json
  accept_header: required
  accept_header_note: >-
    Clients must send `Accept: application/json`; without it the application answers
    browser-style HTML redirects rather than JSON. The first-party reference client
    sets this header on every outbound request.
authentication:
  style: oauth2-bearer
  header: 'Authorization: Bearer {access_token}'
  detail: authentication/koalaboox-authentication.yml
response_envelope:
  shape: '{"data": ...}'
  description: >-
    Successful responses are wrapped in a top-level `data` member. The reference client
    treats a decoded body without a `data` property as an invalid response and raises
    an error, so the envelope is contractual rather than incidental. Collection endpoints
    return `data` as an array; single-resource endpoints return `data` as an object.
  source: https://github.com/koalaboox/api-refarch/blob/master/app/Koalaboox/Client.php
