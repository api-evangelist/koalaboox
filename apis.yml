aid: koalaboox
name: Koalaboox
description: 'Koalaboox is a Belgian cloud invoicing and cash-flow platform for small
  businesses, self-employed professionals and their accountants, now operating as Cegid
  Invoice & Financing — API brand Cegid Click & Finance — following its acquisition
  by Cegid. The platform covers sales invoicing, quotes, purchase-invoice management,
  recurring invoices, dynamic dashboards, bank-account connections and Peppol-based
  electronic invoicing for the Belgian 2026 e-invoicing mandate, sold in Belgium and
  Spain. Alongside the SaaS it offers invoice financing — cash advances against outstanding
  invoices — underwritten by Cegid Fin Belgium. Koalaboox exposes a public REST API
  at connect.koalaboox.com secured with OAuth 2.0 authorization-code grants, documented
  on a Stoplight developer portal, with a first-party Laravel reference architecture
  published on GitHub.'
